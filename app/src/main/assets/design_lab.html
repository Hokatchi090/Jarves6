<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>J.A.R.V.I.S. LAB</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #05080a; overflow: hidden;
    font-family: 'Courier New', monospace;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
  }
  #canvasHost { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  canvas { display: block; touch-action: none; }

  .hud-panel {
    position: absolute;
    color: #7fe9f0;
    background: rgba(6, 18, 22, 0.72);
    border: 1px solid rgba(65, 224, 244, 0.35);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 12px;
    letter-spacing: 1px;
    pointer-events: auto;
  }

  #title {
    top: 10px; left: 50%; transform: translateX(-50%);
    font-size: 14px; font-weight: bold; color: #b9fbff;
    letter-spacing: 3px; pointer-events: none;
    text-shadow: 0 0 8px rgba(65,224,244,0.7);
  }

  #modeBar {
    bottom: 10px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 6px; padding: 6px;
    max-width: 94vw;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    white-space: nowrap;
  }
  #modeBar::-webkit-scrollbar { height: 0; }
  .mode-btn, .action-btn, .part-btn, .ctrl-btn {
    background: rgba(10, 28, 34, 0.85);
    border: 1px solid rgba(65, 224, 244, 0.4);
    color: #8ff2fa;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    letter-spacing: 1px;
    padding: 8px 10px;
    border-radius: 4px;
    pointer-events: auto;
    flex-shrink: 0;
  }
  .mode-btn.active {
    background: rgba(65, 224, 244, 0.85);
    color: #04181c;
    font-weight: bold;
  }
  .action-btn { border-color: rgba(255, 150, 90, 0.5); color: #ffb98a; }

  #partPalette {
    bottom: 60px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 6px; flex-wrap: wrap; max-width: 90vw;
    justify-content: center;
  }

  #counterPanel { top: 10px; left: 10px; }
  #selectedPanel {
    top: 44px; left: 10px; min-width: 150px;
    display: none;
  }
  #ctrlPanel {
    top: 44px; right: 10px;
    display: none;
    flex-direction: column; gap: 4px;
  }
  .ctrl-row { display: flex; gap: 4px; }

  #exportModal {
    position: absolute; top: 8%; left: 5%; width: 90%; height: 78%;
    background: rgba(4, 14, 17, 0.97);
    border: 1px solid rgba(65,224,244,0.5);
    border-radius: 8px;
    display: none;
    flex-direction: column;
    pointer-events: auto;
    z-index: 20;
  }
  #exportModal textarea {
    flex: 1; background: #030a0c; color: #7fe9f0; border: none;
    font-family: monospace; font-size: 11px; padding: 8px; resize: none;
  }
  #exportModal .modal-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px; border-bottom: 1px solid rgba(65,224,244,0.25);
  }

  #hint {
    bottom: 10px; right: 10px; font-size: 10px; opacity: 0.7;
    pointer-events: none; max-width: 40vw; text-align: right;
  }
</style>
</head>
<body>

<div id="canvasHost"></div>

<div id="title">J.A.R.V.I.S. LAB</div>

<div class="hud-panel" id="counterPanel">PARTS: <span id="partsCount">0</span></div>

<div class="hud-panel" id="selectedPanel">
  <div id="selInfo">-</div>
</div>

<div class="hud-panel" id="ctrlPanel">
  <div class="ctrl-row">
    <button class="ctrl-btn" data-act="x-">X-</button>
    <button class="ctrl-btn" data-act="x+">X+</button>
  </div>
  <div class="ctrl-row">
    <button class="ctrl-btn" data-act="y-">Y-</button>
    <button class="ctrl-btn" data-act="y+">Y+</button>
  </div>
  <div class="ctrl-row">
    <button class="ctrl-btn" data-act="z-">Z-</button>
    <button class="ctrl-btn" data-act="z+">Z+</button>
  </div>
  <div class="ctrl-row">
    <button class="ctrl-btn" data-act="s-">SCL-</button>
    <button class="ctrl-btn" data-act="s+">SCL+</button>
  </div>
  <div class="ctrl-row">
    <button class="ctrl-btn" data-act="rot">ROT</button>
    <button class="ctrl-btn action-btn" data-act="del">DEL</button>
  </div>
</div>

<div id="partPalette"></div>

<div class="hud-panel" id="modeBar">
  <button class="mode-btn active" data-mode="FREE">FREE</button>
  <button class="mode-btn" data-mode="ARM">ARM</button>
  <button class="mode-btn" data-mode="ARMOR">ARMOR</button>
  <button class="mode-btn" data-mode="ARCH">ARCH</button>
  <button class="mode-btn" data-mode="TERRAIN">TERRAIN</button>
  <button class="mode-btn" data-mode="MECH">MECH</button>
  <button class="mode-btn" data-mode="ELEC">ELEC</button>
  <button class="mode-btn" data-mode="CHEM">CHEM</button>
  <button class="mode-btn" data-mode="BIO">BIO</button>
  <button class="mode-btn" data-mode="MED">MED</button>
  <button class="mode-btn" data-mode="BLUEPRINT">BLUEPRINT</button>
  <button class="action-btn" id="clearBtn">CLEAR</button>
  <button class="action-btn" id="exportBtn">EXPORT</button>
</div>

<div id="hint">drag: orbit | pinch: zoom | tap: select</div>

<div id="exportModal">
  <div class="modal-bar">
    <span style="color:#8ff2fa;font-size:12px;">EXPORT JSON</span>
    <button class="action-btn" id="closeExport">CLOSE</button>
  </div>
  <textarea id="exportText" readonly></textarea>
</div>

<script>
  // ---------------- Load Three.js: local file first, CDN fallback ----------------
  var threeLoadHandled = false;

  function onThreeReady() {
    if (typeof THREE === 'undefined') return;
    loadGLTFLoader();
  }

  function loadThreeFallbackCDN() {
    var s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
    s.onload = onThreeReady;
    s.onerror = function () {
      document.getElementById('title').textContent = 'THREE.JS LOAD FAILED';
    };
    document.head.appendChild(s);
  }

  (function loadThreeLocal() {
    var s = document.createElement('script');
    s.src = 'three.min.js';
    s.onload = onThreeReady;
    s.onerror = loadThreeFallbackCDN;
    document.head.appendChild(s);
  })();

  // ---------------- Load GLTFLoader (for real .glb/.gltf model files): local file first, CDN fallback ----------------
  function onGLTFLoaderReady() {
    if (threeLoadHandled) return;
    threeLoadHandled = true;
    initApp();
  }

  function loadGLTFLoaderFallbackCDN() {
    var s = document.createElement('script');
    s.src = 'https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js';
    s.onload = onGLTFLoaderReady;
    s.onerror = function () {
      // \u0645\u0627\u0641\u064A\u0634 GLTFLoader \u0645\u062A\u0648\u0641\u0631\u060C \u0628\u0627\u0642\u064A \u0627\u0644\u0645\u062E\u062A\u0628\u0631 \u064A\u062E\u062F\u0645 \u0628\u0627\u0644\u0623\u0634\u0643\u0627\u0644 \u0627\u0644\u0623\u0633\u0627\u0633\u064A\u0629 \u0641\u0642\u0637 (\u0628\u0644\u0627 \u0645\u0644\u0641\u0627\u062A GLB)
      onGLTFLoaderReady();
    };
    document.head.appendChild(s);
  }

  function loadGLTFLoader() {
    var s = document.createElement('script');
    s.src = 'GLTFLoader.js';
    s.onload = onGLTFLoaderReady;
    s.onerror = loadGLTFLoaderFallbackCDN;
    document.head.appendChild(s);
  }
</script>

<script>
// ================== J.A.R.V.I.S. DESIGN LAB CORE ==================
// \u0645\u0644\u0641 \u0645\u062a\u0643\u0627\u0645\u0644: \u0645\u0634\u0647\u062f \u062b\u0644\u0627\u062b\u064a \u0627\u0644\u0623\u0628\u0639\u0627\u062f + \u0648\u0627\u062c\u0647\u0629 HUD + \u062a\u062d\u0643\u0645 \u0643\u0627\u0645\u064a\u0631\u0627 \u0628\u0627\u0644\u0644\u0645\u0633 + \u062a\u062d\u0631\u064a\u0643/\u0627\u062e\u062a\u064a\u0627\u0631/\u062d\u0630\u0641 \u0623\u062c\u0632\u0627\u0621 + \u062a\u0635\u062f\u064a\u0631 JSON

var scene, camera, renderer;
var parts = [];      // { id, type, mesh, mode }
var selectedPart = null;
var nextId = 1;

var isBlueprint = false;
var currentMode = 'FREE';

// ---------------- Camera orbit state ----------------
var camTarget = new (function () {})(); // placeholder, replaced after THREE loads
var orbit = { radius: 6, azimuth: 0.6, elevation: 0.5 };

// ---------------- Part definitions per mode ----------------
var PART_DEFS = {
  ARM: [
    { label: 'JOINT', type: 'joint' },
    { label: 'CYLINDER', type: 'cylinder' },
    { label: 'PLATE', type: 'plate' },
    { label: 'SPHERE', type: 'sphere' },
    { label: 'TORUS', type: 'torus' },
    { label: 'BOLT', type: 'bolt' },
    { label: 'SERVO MOTOR', type: 'servo_motor' },
    { label: 'STEPPER MOTOR', type: 'stepper_motor' },
    { label: 'CHAIN LINK', type: 'chain_link' }
  ],
  ARMOR: [
    { label: 'PLATE', type: 'plate' },
    { label: 'SPHERE', type: 'sphere' },
    { label: 'BOX', type: 'box' },
    { label: 'TORUS', type: 'torus' }
  ],
  ARCH: [
    { label: 'WALL', type: 'wall' },
    { label: 'COLUMN', type: 'column' },
    { label: 'BOX', type: 'box' },
    { label: 'ARCH', type: 'arch' },
    { label: 'CYLINDER', type: 'cylinder' }
  ],
  TERRAIN: [
    { label: 'HILL', type: 'hill' },
    { label: 'ROCK', type: 'rock' },
    { label: 'PLATEAU', type: 'plateau' },
    { label: 'RIDGE', type: 'ridge' }
  ],
  MECH: [
    { label: 'BOLT', type: 'bolt' },
    { label: 'NUT', type: 'nut' },
    { label: 'GEAR', type: 'gear' },
    { label: 'SPRING', type: 'spring' },
    { label: 'PISTON', type: 'piston' },
    { label: 'BEARING', type: 'bearing' },
    { label: 'WRENCH', type: 'wrench' },
    { label: 'DC MOTOR', type: 'dc_motor' },
    { label: 'SERVO MOTOR', type: 'servo_motor' },
    { label: 'STEPPER MOTOR', type: 'stepper_motor' },
    { label: 'CHAIN LINK', type: 'chain_link' },
    { label: 'METAL PLATE', type: 'metal_plate' }
  ],
  ELEC: [
    { label: 'RESISTOR', type: 'resistor' },
    { label: 'CAPACITOR', type: 'capacitor' },
    { label: 'BATTERY', type: 'battery' },
    { label: 'LED', type: 'led' },
    { label: 'COIL', type: 'coil' },
    { label: 'CIRCUIT BOARD', type: 'circuit_board' },
    { label: 'SWITCH', type: 'switch' }
  ],
  CHEM: [
    { label: 'FLASK', type: 'flask' },
    { label: 'TEST TUBE', type: 'test_tube' },
    { label: 'BEAKER', type: 'beaker' },
    { label: 'MOLECULE', type: 'molecule' },
    { label: 'ATOM', type: 'atom' }
  ],
  BIO: [
    { label: 'CELL', type: 'cell' },
    { label: 'DNA HELIX', type: 'dna' },
    { label: 'NUCLEUS', type: 'nucleus' },
    { label: 'VIRUS', type: 'virus' }
  ],
  MED: [
    { label: 'PILL', type: 'pill' },
    { label: 'CAPSULE', type: 'capsule' },
    { label: 'SYRINGE', type: 'syringe' },
    { label: 'MEDICAL CROSS', type: 'medical_cross' },
    { label: 'IV BAG', type: 'iv_bag' }
  ]
};

function buildGeometry(type) {
  switch (type) {
    case 'joint': return new THREE.SphereGeometry(0.3, 16, 16);
    case 'cylinder': return new THREE.CylinderGeometry(0.25, 0.25, 1, 16);
    case 'plate': return new THREE.BoxGeometry(1, 0.1, 1);
    case 'sphere': return new THREE.SphereGeometry(0.4, 16, 16);
    case 'torus': return new THREE.TorusGeometry(0.4, 0.12, 12, 24);
    case 'box': return new THREE.BoxGeometry(0.6, 0.6, 0.6);
    case 'wall': return new THREE.BoxGeometry(2, 1, 0.15);
    case 'column': return new THREE.CylinderGeometry(0.2, 0.2, 1.5, 16);
    case 'arch': return new THREE.TorusGeometry(0.8, 0.1, 10, 24, Math.PI);
    case 'hill': return new THREE.ConeGeometry(0.8, 0.6, 16);
    case 'rock': return new THREE.IcosahedronGeometry(0.4, 0);
    case 'plateau': return new THREE.BoxGeometry(1.5, 0.2, 1.5);
    case 'ridge': return new THREE.BoxGeometry(2, 0.3, 0.4);

    // ---- MECH: \u0642\u0637\u0639 \u0645\u064A\u0643\u0627\u0646\u064A\u0643\u064A\u0629 \u062D\u0642\u064A\u0642\u064A\u0629 \u0644\u0643\u0644 \u0646\u0648\u0639 ----
    case 'bolt': return new THREE.CylinderGeometry(0.15, 0.15, 0.45, 6);
    case 'nut': return new THREE.CylinderGeometry(0.22, 0.22, 0.14, 6);
    case 'gear': return new THREE.TorusGeometry(0.35, 0.16, 6, 14);
    case 'spring': return new THREE.TorusGeometry(0.18, 0.09, 8, 20);
    case 'piston': return new THREE.CylinderGeometry(0.16, 0.16, 0.95, 16);
    case 'bearing': return new THREE.TorusGeometry(0.3, 0.11, 12, 26);
    case 'wrench': return new THREE.BoxGeometry(0.9, 0.14, 0.08);
    case 'dc_motor': return new THREE.CylinderGeometry(0.3, 0.3, 0.65, 18);
    case 'servo_motor': return new THREE.BoxGeometry(0.42, 0.32, 0.5);
    case 'stepper_motor': return new THREE.BoxGeometry(0.5, 0.5, 0.42);
    case 'chain_link': return new THREE.TorusGeometry(0.2, 0.06, 8, 16);
    case 'metal_plate': return new THREE.BoxGeometry(1.2, 0.06, 0.8);

    // ---- ELEC: \u0642\u0637\u0639 \u0643\u0647\u0631\u0628\u0627\u0626\u064A\u0629 ----
    case 'resistor': return new THREE.CylinderGeometry(0.12, 0.12, 0.5, 12);
    case 'capacitor': return new THREE.CylinderGeometry(0.16, 0.16, 0.32, 16);
    case 'battery': return new THREE.CylinderGeometry(0.18, 0.18, 0.6, 16);
    case 'led': return new THREE.ConeGeometry(0.15, 0.32, 12);
    case 'coil': return new THREE.TorusGeometry(0.2, 0.07, 10, 20);
    case 'circuit_board': return new THREE.BoxGeometry(1, 0.05, 0.7);
    case 'switch': return new THREE.BoxGeometry(0.3, 0.15, 0.2);

    // ---- CHEM: \u0623\u062F\u0648\u0627\u062A \u0648\u0639\u0646\u0627\u0635\u0631 \u0643\u064A\u0645\u064A\u0627\u0626\u064A\u0629 ----
    case 'flask': return new THREE.CylinderGeometry(0.1, 0.32, 0.55, 16);
    case 'test_tube': return new THREE.CylinderGeometry(0.08, 0.08, 0.6, 12);
    case 'beaker': return new THREE.CylinderGeometry(0.26, 0.22, 0.4, 16);
    case 'molecule': return new THREE.SphereGeometry(0.45, 12, 12);
    case 'atom': return new THREE.SphereGeometry(0.2, 14, 14);

    // ---- BIO: \u0639\u0646\u0627\u0635\u0631 \u0628\u064A\u0648\u0644\u0648\u062C\u064A\u0629 ----
    case 'cell': return new THREE.SphereGeometry(0.45, 16, 16);
    case 'dna': return new THREE.TorusGeometry(0.28, 0.07, 8, 32, Math.PI * 3.4);
    case 'nucleus': return new THREE.SphereGeometry(0.22, 14, 14);
    case 'virus': return new THREE.IcosahedronGeometry(0.3, 1);

    // ---- MED: \u0623\u062F\u0648\u0627\u062A \u0648\u0645\u0639\u062F\u0627\u062A \u0637\u0628\u064A\u0629 ----
    case 'pill': return new THREE.CylinderGeometry(0.15, 0.15, 0.5, 16);
    case 'capsule': return new THREE.CylinderGeometry(0.12, 0.12, 0.4, 14);
    case 'syringe': return new THREE.CylinderGeometry(0.09, 0.09, 0.75, 12);
    case 'medical_cross': return new THREE.BoxGeometry(0.16, 0.6, 0.16);
    case 'iv_bag': return new THREE.BoxGeometry(0.4, 0.5, 0.1);

    default: return new THREE.BoxGeometry(0.5, 0.5, 0.5);
  }
}

function baseMaterial() {
  return new THREE.MeshStandardMaterial({
    color: 0x2fb8c9,
    metalness: 0.35,
    roughness: 0.45,
    emissive: 0x0a3a40,
    emissiveIntensity: 0.25
  });
}

function blueprintMaterial() {
  return new THREE.MeshBasicMaterial({ color: 0x41e0f4, wireframe: true });
}

function standardMaterial(colorHex) {
  return new THREE.MeshStandardMaterial({
    color: colorHex,
    metalness: 0.4,
    roughness: 0.5,
    emissive: 0x0a2a2e,
    emissiveIntensity: 0.15
  });
}

// \u064A\u0628\u0646\u064A Mesh \u0645\u0644\u0648\u0651\u0646\u060C \u0648\u064A\u062E\u0632\u0651\u0646 \u0644\u0648\u0646\u0647 \u0627\u0644\u0623\u0635\u0644\u064A \u0641\u064A userData \u0628\u0627\u0634 \u0646\u0642\u062F\u0631 \u0646\u0631\u062C\u0639\u0648 \u0645\u0644\u064A \u0646\u062E\u0631\u062C \u0645\u0646 \u0648\u0636\u0639 \u0627\u0644\u0628\u0644\u0648\u0628\u0631\u0646\u062A
function coloredMesh(geometry, colorHex) {
  var mat = isBlueprint ? blueprintMaterial() : standardMaterial(colorHex);
  var mesh = new THREE.Mesh(geometry, mat);
  mesh.userData.baseColor = colorHex;
  return mesh;
}

// \u064A\u0628\u0646\u064A \u0642\u0637\u0639\u0629 \u0645\u0631\u0643\u0651\u0628\u0629 (Group) \u0645\u0646 \u0639\u062F\u0629 \u0623\u0634\u0643\u0627\u0644 \u0628\u0633\u064A\u0637\u0629\u060C \u0644\u0644\u0642\u0637\u0639 \u0627\u0644\u0644\u064A \u0645\u0627\u0641\u064A\u0647\u0627\u0634 \u0634\u0643\u0644 \u062C\u0627\u0647\u0632 \u0641\u064A Three.js
function buildPartObject(type) {
  var simpleTypes = ['joint', 'cylinder', 'plate', 'sphere', 'torus', 'box',
    'wall', 'column', 'arch', 'hill', 'rock', 'plateau', 'ridge'];
  if (simpleTypes.indexOf(type) !== -1) {
    return coloredMesh(buildGeometry(type), 0x2fb8c9);
  }

  var g = new THREE.Group();
  var m; // temp mesh helper

  switch (type) {
    // ---- MECH ----
    case 'bolt':
      m = coloredMesh(new THREE.CylinderGeometry(0.22, 0.22, 0.12, 6), 0x9aa0a6);
      m.position.set(0, 0.3, 0);
      g.add(m);
      m = coloredMesh(new THREE.CylinderGeometry(0.08, 0.08, 0.55, 10), 0x9aa0a6);
      m.position.set(0, 0, 0);
      g.add(m);
      return g;

    case 'nut':
      return coloredMesh(new THREE.CylinderGeometry(0.24, 0.24, 0.15, 6), 0x7d838a);

    case 'gear':
      m = coloredMesh(new THREE.CylinderGeometry(0.4, 0.4, 0.15, 10), 0x8a8f94);
      g.add(m);
      m = coloredMesh(new THREE.TorusGeometry(0.4, 0.06, 8, 10), 0x8a8f94);
      m.rotation.x = Math.PI / 2;
      g.add(m);
      return g;

    case 'spring':
      for (var i = 0; i < 6; i++) {
        m = coloredMesh(new THREE.TorusGeometry(0.22, 0.045, 8, 16), 0xb0b5ba);
        m.rotation.x = Math.PI / 2;
        m.position.y = i * 0.13 - 0.32;
        g.add(m);
      }
      return g;

    case 'piston':
      m = coloredMesh(new THREE.CylinderGeometry(0.32, 0.32, 0.5, 16), 0x8a8f94);
      g.add(m);
      m = coloredMesh(new THREE.CylinderGeometry(0.07, 0.07, 0.55, 10), 0xb0b5ba);
      m.position.set(0, 0.5, 0);
      g.add(m);
      return g;

    case 'bearing':
      m = coloredMesh(new THREE.TorusGeometry(0.32, 0.08, 10, 20), 0x9aa0a6);
      m.rotation.x = Math.PI / 2;
      g.add(m);
      m = coloredMesh(new THREE.CylinderGeometry(0.14, 0.14, 0.16, 12), 0x6a6f74);
      g.add(m);
      for (var b = 0; b < 6; b++) {
        var ang = (b / 6) * Math.PI * 2;
        m = coloredMesh(new THREE.SphereGeometry(0.045, 8, 8), 0xd7dade);
        m.position.set(Math.cos(ang) * 0.32, 0, Math.sin(ang) * 0.32);
        g.add(m);
      }
      return g;

    case 'wrench':
      m = coloredMesh(new THREE.BoxGeometry(0.9, 0.1, 0.15), 0xb0b5ba);
      g.add(m);
      m = coloredMesh(new THREE.TorusGeometry(0.18, 0.05, 8, 16, Math.PI * 1.4), 0xb0b5ba);
      m.position.set(0.5, 0, 0);
      g.add(m);
      return g;

    case 'dc_motor':
      m = coloredMesh(new THREE.CylinderGeometry(0.3, 0.3, 0.6, 16), 0x3a4046);
      g.add(m);
      m = coloredMesh(new THREE.CylinderGeometry(0.05, 0.05, 0.3, 10), 0xd7dade);
      m.position.set(0, 0.45, 0);
      g.add(m);
      return g;

    case 'servo_motor':
      m = coloredMesh(new THREE.BoxGeometry(0.4, 0.35, 0.25), 0x2e5aa8);
      g.add(m);
      m = coloredMesh(new THREE.CylinderGeometry(0.05, 0.05, 0.15, 10), 0xd7dade);

// ---------------- Init ----------------
function initApp() {
  var host = document.getElementById('canvasHost');

  scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x05080a, 8, 30);

  camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x05080a, 1);
  host.appendChild(renderer.domElement);

  var ambient = new THREE.AmbientLight(0x335a60, 0.9);
  scene.add(ambient);
  var dir = new THREE.DirectionalLight(0x9fe9ff, 0.8);
  dir.position.set(3, 5, 4);
  scene.add(dir);

  var grid = new THREE.GridHelper(20, 20, 0x1c5a63, 0x102025);
  scene.add(grid);

  updateCamera();
  window.addEventListener('resize', onResize);
  setupInputHandlers(renderer.domElement);
  setupUI();

  animate();
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function updateCamera() {
  var r = orbit.radius;
  var az = orbit.azimuth;
  var el = orbit.elevation;
  camera.position.x = r * Math.cos(el) * Math.sin(az);
  camera.position.y = r * Math.sin(el);
  camera.position.z = r * Math.cos(el) * Math.cos(az);
  camera.lookAt(0, 0.3, 0);
}

function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}

// ---------------- Adding / removing parts ----------------
// \u062E\u0631\u064A\u0637\u0629 \u0627\u062E\u062A\u064A\u0627\u0631\u064A\u0629: \u0646\u0648\u0639 \u0627\u0644\u062C\u0632\u0621 -> \u0645\u0633\u0627\u0631 \u0645\u0644\u0641 GLB \u062D\u0642\u064A\u0642\u064A (\u0627\u062E\u062A\u064A\u0627\u0631\u064A). \u0625\u0630\u0627 \u062D\u0637\u064A\u062A \u0645\u0633\u0627\u0631 \u0647\u0646\u0627\u060C \u0627\u0644\u062C\u0632\u0621 \u064A\u062A\u062D\u0645\u0644 \u0643\u0646\u0645\u0648\u0630\u062C \u062D\u0642\u064A\u0642\u064A \u0628\u062F\u0644 \u0627\u0644\u0634\u0643\u0644 \u0627\u0644\u0628\u0633\u064A\u0637.
// \u0645\u062B\u0627\u0644: GLB_SOURCES.gear = 'models/gear.glb';  (\u0627\u0644\u0645\u0644\u0641 \u064A\u0631\u0648\u062D \u0641\u064A app/src/main/assets/models/gear.glb)
var GLB_SOURCES = {
  // 'bolt': 'models/bolt.glb',
  // 'gear': 'models/gear.glb',
  // 'dna': 'models/dna.glb',
};

var gltfLoaderInstance = (typeof THREE !== 'undefined' && THREE.GLTFLoader) ? new THREE.GLTFLoader() : null;

function disposeObject3D(obj) {
  obj.traverse(function (child) {
    if (child.isMesh) {
      if (child.geometry) child.geometry.dispose();
      if (child.material) {
        if (Array.isArray(child.material)) {
          child.material.forEach(function (m) { m.dispose(); });
        } else {
          child.material.dispose();
        }
      }
    }
  });
}

function findPartByObject(obj) {
  var current = obj;
  while (current) {
    for (var i = 0; i < parts.length; i++) {
      if (parts[i].mesh === current) return parts[i];
    }
    current = current.parent;
  }
  return null;
}

function finalizePart(type, modeLabel, object3d) {
  var part = { id: nextId++, type: type, mode: modeLabel, mesh: object3d };
  parts.push(part);
  selectPart(part);
  updateCounter();
}

function addPart(type, modeLabel) {
  var offset = (parts.length % 6) * 0.9 - 2.2;
  var posX = offset, posY = 0.5, posZ = (Math.floor(parts.length / 6)) * 0.9 - 1;
  var glbPath = GLB_SOURCES[type];

  if (glbPath && gltfLoaderInstance) {
    gltfLoaderInstance.load(
      glbPath,
      function (gltf) {
        var group = gltf.scene;
        group.position.set(posX, posY, posZ);

        var box = new THREE.Box3().setFromObject(group);
        var size = new THREE.Vector3();
        box.getSize(size);
        var maxDim = Math.max(size.x, size.y, size.z, 0.001);
        group.scale.setScalar(0.8 / maxDim);

        group.traverse(function (child) {
          if (child.isMesh) {
            child.userData.origMaterial = child.material;
            if (isBlueprint) child.material = blueprintMaterial();
          }
        });

        scene.add(group);
        finalizePart(type, modeLabel, group);
      },
      undefined,
      function () {
        // \u0641\u0634\u0644 \u062A\u062D\u0645\u064A\u0644 \u0645\u0644\u0641 GLB (\u063A\u064A\u0631 \u0645\u0648\u062C\u0648\u062F \u0623\u0648 \u062E\u0637\u0623 \u0634\u0628\u0643\u0629): \u0646\u0631\u062C\u0639 \u0644\u0644\u0634\u0643\u0644 \u0627\u0644\u0628\u0633\u064A\u0637 \u0628\u062F\u0644\u0627\u064B \u0645\u0646 \u0643\u0633\u0631 \u0627\u0644\u062A\u062C\u0631\u0628\u0629
        var geo = buildGeometry(type);
        var mat = isBlueprint ? blueprintMaterial() : baseMaterial();
        var mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(posX, posY, posZ);
        scene.add(mesh);
        finalizePart(type, modeLabel, mesh);
      }
    );
    return;
  }

  var geo = buildGeometry(type);
  var mat = isBlueprint ? blueprintMaterial() : baseMaterial();
  var mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(posX, posY, posZ);
  scene.add(mesh);
  finalizePart(type, modeLabel, mesh);
}

function removePart(part) {
  scene.remove(part.mesh);
  disposeObject3D(part.mesh);
  var idx = parts.indexOf(part);
  if (idx >= 0) parts.splice(idx, 1);
  if (selectedPart === part) selectPart(null);
  updateCounter();
}

function clearAll() {
  while (parts.length > 0) {
    removePart(parts[0]);
  }
}

// ---------------- Selection ----------------
function selectPart(part) {
  if (selectedPart) {
    selectedPart.mesh.scale.divideScalar(1.0);
  }
  selectedPart = part;
  var panel = document.getElementById('selectedPanel');
  var ctrl = document.getElementById('ctrlPanel');
  if (!part) {
    panel.style.display = 'none';
    ctrl.style.display = 'none';
    return;
  }
  panel.style.display = 'block';
  ctrl.style.display = 'flex';
  refreshSelectedInfo();
}

function refreshSelectedInfo() {
  if (!selectedPart) return;
  var p = selectedPart.mesh.position;
  var s = selectedPart.mesh.scale;
  document.getElementById('selInfo').innerHTML =
    'TYPE: ' + selectedPart.type.toUpperCase() + '<br>' +
    'POS: ' + p.x.toFixed(2) + ', ' + p.y.toFixed(2) + ', ' + p.z.toFixed(2) + '<br>' +
    'SCALE: ' + s.x.toFixed(2);
}

function updateCounter() {
  document.getElementById('partsCount').textContent = parts.length;
}

// ---------------- Part manipulation ----------------
var STEP = 0.15;
var SCALE_STEP = 0.1;

function applyControlAction(act) {
  if (!selectedPart) return;
  var mesh = selectedPart.mesh;
  switch (act) {
    case 'x-': mesh.position.x -= STEP; break;
    case 'x+': mesh.position.x += STEP; break;
    case 'y-': mesh.position.y -= STEP; break;
    case 'y+': mesh.position.y += STEP; break;
    case 'z-': mesh.position.z -= STEP; break;
    case 'z+': mesh.position.z += STEP; break;
    case 's-':
      var ns = Math.max(0.2, mesh.scale.x - SCALE_STEP);
      mesh.scale.set(ns, ns, ns);
      break;
    case 's+':
      var ps = mesh.scale.x + SCALE_STEP;
      mesh.scale.set(ps, ps, ps);
      break;
    case 'rot':
      mesh.rotation.y += Math.PI / 8;
      break;
    case 'del':
      removePart(selectedPart);
      return;
  }
  refreshSelectedInfo();
}

// ---------------- Blueprint mode toggle ----------------
function setBlueprint(active) {
  isBlueprint = active;
  parts.forEach(function (part) {
    part.mesh.traverse(function (child) {
      if (!child.isMesh) return;
      if (active) {
        if (!child.userData.origMaterial) child.userData.origMaterial = child.material;
        child.material = blueprintMaterial();
      } else if (child.userData.origMaterial) {
        child.material = child.userData.origMaterial;
      } else {
        child.material = baseMaterial();
      }
    });
  });
}

// ---------------- Mode switching / palette ----------------
function setMode(mode) {
  currentMode = mode;

  document.querySelectorAll('.mode-btn').forEach(function (btn) {
    btn.classList.toggle('active', btn.getAttribute('data-mode') === mode);
  });

  setBlueprint(mode === 'BLUEPRINT');

  var palette = document.getElementById('partPalette');
  palette.innerHTML = '';

  var defs = PART_DEFS[mode];
  if (!defs) return; // FREE and BLUEPRINT have no palette of their own

  defs.forEach(function (def) {
    var b = document.createElement('button');
    b.className = 'part-btn';
    b.textContent = def.label;
    b.addEventListener('click', function () {
      addPart(def.type, mode);
    });
    palette.appendChild(b);
  });
}

// ---------------- Export ----------------
function exportDesign() {
  var data = parts.map(function (p) {
    return {
      type: p.type,
      mode: p.mode,
      position: { x: p.mesh.position.x, y: p.mesh.position.y, z: p.mesh.position.z },
      rotationY: p.mesh.rotation.y,
      scale: p.mesh.scale.x
    };
  });
  var json = JSON.stringify({ parts: data, count: data.length }, null, 2);

  document.getElementById('exportText').value = json;
  document.getElementById('exportModal').style.display = 'flex';

  if (window.AndroidBridge && window.AndroidBridge.exportDesign) {
    window.AndroidBridge.exportDesign(json);
  }
}

// ---------------- UI wiring ----------------
function setupUI() {
  document.querySelectorAll('.mode-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      setMode(btn.getAttribute('data-mode'));
    });
  });

  document.getElementById('clearBtn').addEventListener('click', clearAll);
  document.getElementById('exportBtn').addEventListener('click', exportDesign);
  document.getElementById('closeExport').addEventListener('click', function () {
    document.getElementById('exportModal').style.display = 'none';
  });

  document.querySelectorAll('.ctrl-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      applyControlAction(btn.getAttribute('data-act'));
    });
  });
}

// ---------------- Touch / mouse input: orbit, pinch-zoom, tap-select ----------------
function setupInputHandlers(dom) {
  var pointers = {};
  var dragStart = null;
  var dragged = false;
  var pinchStartDist = null;
  var pinchStartRadius = null;

  function dist(p1, p2) {
    var dx = p1.x - p2.x, dy = p1.y - p2.y;
    return Math.sqrt(dx * dx + dy * dy);
  }

  function getPointerList() {
    var list = [];
    for (var id in pointers) list.push(pointers[id]);
    return list;
  }

  dom.addEventListener('pointerdown', function (e) {
    dom.setPointerCapture(e.pointerId);
    pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    var list = getPointerList();
    if (list.length === 1) {
      dragStart = { x: e.clientX, y: e.clientY, az: orbit.azimuth, el: orbit.elevation };
      dragged = false;
    } else if (list.length === 2) {
      pinchStartDist = dist(list[0], list[1]);
      pinchStartRadius = orbit.radius;
    }
  });

  dom.addEventListener('pointermove', function (e) {
    if (!pointers[e.pointerId]) return;
    pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    var list = getPointerList();

    if (list.length === 1 && dragStart) {
      var dx = e.clientX - dragStart.x;
      var dy = e.clientY - dragStart.y;
      if (Math.abs(dx) > 3 || Math.abs(dy) > 3) dragged = true;
      orbit.azimuth = dragStart.az - dx * 0.005;
      orbit.elevation = Math.max(-1.3, Math.min(1.3, dragStart.el + dy * 0.005));
      updateCamera();
    } else if (list.length === 2 && pinchStartDist) {
      var d = dist(list[0], list[1]);
      var ratio = pinchStartDist / Math.max(d, 0.001);
      orbit.radius = Math.max(2, Math.min(20, pinchStartRadius * ratio));
      updateCamera();
      dragged = true;
    }
  });

  function endPointer(e) {
    var wasSingleTap = !dragged && getPointerList().length === 1;
    delete pointers[e.pointerId];
    if (getPointerList().length < 2) {
      pinchStartDist = null;
    }
    if (Object.keys(pointers).length === 0) {
      if (wasSingleTap) {
        handleTapSelect(e.clientX, e.clientY);
      }
      dragStart = null;
      dragged = false;
    }
  }

  dom.addEventListener('pointerup', endPointer);
  dom.addEventListener('pointercancel', endPointer);

  // Desktop mouse wheel zoom (for testing on a computer)
  dom.addEventListener('wheel', function (e) {
    e.preventDefault();
    orbit.radius = Math.max(2, Math.min(20, orbit.radius + e.deltaY * 0.01));
    updateCamera();
  }, { passive: false });
}

function handleTapSelect(clientX, clientY) {
  if (parts.length === 0) return;
  var mouse = new THREE.Vector2(
    (clientX / window.innerWidth) * 2 - 1,
    -(clientY / window.innerHeight) * 2 + 1
  );
  var raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(mouse, camera);
  var meshes = parts.map(function (p) { return p.mesh; });
  var hits = raycaster.intersectObjects(meshes, true);
  if (hits.length > 0) {
    var found = findPartByObject(hits[0].object);
    if (found) selectPart(found);
  } else {
    selectPart(null);
  }
}

// Default mode on load
window.addEventListener('load', function () {
  // setMode is called after THREE finishes loading via initApp -> but UI listeners
  // are attached in setupUI() which runs inside initApp(); default visual state
  // (FREE active) is already set in the HTML markup.
});
</script>
