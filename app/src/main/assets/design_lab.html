<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Jarvis Design Lab</title>
<style>
  html, body {
    margin: 0; padding: 0;
    background: #14171a;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    color: #a9d8e0;
    -webkit-user-select: none;
    user-select: none;
  }
  #scene-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

  #topbar {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px;
    background: rgba(20,26,30,0.7);
    border-bottom: 1px solid rgba(65,224,244,0.25);
    font-size: 12px;
    letter-spacing: 2px;
    color: #7fd8e8;
    z-index: 10;
  }

  #toolbar {
    position: absolute; bottom: 0; left: 0; right: 0;
    display: flex; gap: 8px; flex-wrap: wrap;
    padding: 10px;
    background: rgba(20,26,30,0.85);
    border-top: 1px solid rgba(65,224,244,0.25);
    z-index: 10;
  }

  button {
    background: rgba(15,25,30,0.9);
    border: 1px solid rgba(65,224,244,0.45);
    color: #9fe4f0;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    letter-spacing: 1px;
    padding: 9px 12px;
    border-radius: 6px;
    flex: 1;
    min-width: 70px;
  }

  button:active { background: rgba(65,224,244,0.25); }

  #panel {
    position: absolute; top: 46px; right: 10px;
    width: 150px;
    background: rgba(15,25,30,0.85);
    border: 1px solid rgba(65,224,244,0.3);
    border-radius: 8px;
    padding: 10px;
    font-size: 10px;
    display: none;
    z-index: 10;
  }

  #panel.visible { display: block; }

  #panel label { display: block; margin-top: 6px; color: #7fd8e8; }

  #panel input[type=range] {
    width: 100%;
  }

  #panel .row { display: flex; justify-content: space-between; }

  #partCount {
    position: absolute; top: 46px; left: 10px;
    font-size: 10px;
    color: rgba(150,200,215,0.6);
    z-index: 10;
  }
</style>
</head>
<body>

<div id="topbar">
  <span>J.A.R.V.I.S. // DESIGN LAB</span>
  <span id="selInfo">NO SELECTION</span>
</div>

<div id="partCount">PARTS: 0</div>

<div id="scene-container"></div>

<div id="panel">
  <div class="row"><span>POS X</span></div>
  <input type="range" id="posX" min="-5" max="5" step="0.1" value="0">
  <div class="row"><span>POS Y</span></div>
  <input type="range" id="posY" min="-5" max="5" step="0.1" value="0">
  <div class="row"><span>POS Z</span></div>
  <input type="range" id="posZ" min="-5" max="5" step="0.1" value="0">
  <div class="row"><span>SCALE</span></div>
  <input type="range" id="scaleAll" min="0.2" max="3" step="0.1" value="1">
  <div class="row"><span>ROTATE Y</span></div>
  <input type="range" id="rotY" min="0" max="360" step="1" value="0">
  <button id="deleteBtn" style="margin-top:10px; width:100%; color:#ff8a8a; border-color:rgba(255,120,120,0.4);">DELETE PART</button>
</div>

<div id="toolbar">
  <button onclick="addPart('box')">+ BOX</button>
  <button onclick="addPart('cylinder')">+ CYLINDER</button>
  <button onclick="addPart('sphere')">+ SPHERE</button>
  <button onclick="addPart('cone')">+ CONE</button>
  <button onclick="resetScene()">CLEAR ALL</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  var scene, camera, renderer;
  var parts = [];
  var selected = null;

  var cameraAngleX = 0.6;
  var cameraAngleY = 0.8;
  var cameraDistance = 10;

  function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x14171a);

    camera = new THREE.PerspectiveCamera(
      55, window.innerWidth / window.innerHeight, 0.1, 1000
    );
    updateCameraPosition();

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('scene-container').appendChild(renderer.domElement);

    var ambient = new THREE.AmbientLight(0x88ccdd, 0.7);
    scene.add(ambient);
    var point = new THREE.PointLight(0x41e0f4, 1.1);
    point.position.set(5, 8, 5);
    scene.add(point);

    var grid = new THREE.GridHelper(14, 28, 0x2f7f90, 0x1c3238);
    scene.add(grid);

    var axesHelper = new THREE.AxesHelper(2);
    scene.add(axesHelper);

    setupTouchControls();
    animate();
  }

  function updateCameraPosition() {
    camera.position.x = cameraDistance * Math.sin(cameraAngleY) * Math.cos(cameraAngleX);
    camera.position.y = cameraDistance * Math.sin(cameraAngleX);
    camera.position.z = cameraDistance * Math.cos(cameraAngleY) * Math.cos(cameraAngleX);
    camera.lookAt(0, 0, 0);
  }

  function setupTouchControls() {
    var lastX = 0, lastY = 0, dragging = false;
    var lastDist = 0, pinching = false;

    var el = renderer.domElement;

    el.addEventListener('touchstart', function(e) {
      if (e.touches.length === 1) {
        dragging = true;
        lastX = e.touches[0].clientX;
        lastY = e.touches[0].clientY;
      } else if (e.touches.length === 2) {
        pinching = true;
        lastDist = touchDistance(e.touches);
      }
    });

    el.addEventListener('touchmove', function(e) {
      e.preventDefault();
      if (dragging && e.touches.length === 1) {
        var dx = e.touches[0].clientX - lastX;
        var dy = e.touches[0].clientY - lastY;
        cameraAngleY += dx * 0.01;
        cameraAngleX = Math.max(-1.4, Math.min(1.4, cameraAngleX + dy * 0.01));
        lastX = e.touches[0].clientX;
        lastY = e.touches[0].clientY;
        updateCameraPosition();
      } else if (pinching && e.touches.length === 2) {
        var dist = touchDistance(e.touches);
        var delta = dist - lastDist;
        cameraDistance = Math.max(3, Math.min(30, cameraDistance - delta * 0.03));
        lastDist = dist;
        updateCameraPosition();
      }
    }, { passive: false });

    el.addEventListener('touchend', function(e) {
      dragging = false;
      pinching = false;
    });

    el.addEventListener('touchstart', function(e) {
      if (e.touches.length === 1) {
        var rect = el.getBoundingClientRect();
        var x = ((e.touches[0].clientX - rect.left) / rect.width) * 2 - 1;
        var y = -((e.touches[0].clientY - rect.top) / rect.height) * 2 + 1;

        var raycaster = new THREE.Raycaster();
        raycaster.setFromCamera({ x: x, y: y }, camera);
        var meshes = parts.map(function(p) { return p.mesh; });
        var hits = raycaster.intersectObjects(meshes);

        if (hits.length > 0) {
          selectPart(hits[0].object);
        }
      }
    });
  }

  function touchDistance(touches) {
    var dx = touches[0].clientX - touches[1].clientX;
    var dy = touches[0].clientY - touches[1].clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }

  function makeGeometry(type) {
    if (type === 'box') return new THREE.BoxGeometry(1, 1, 1);
    if (type === 'cylinder') return new THREE.CylinderGeometry(0.5, 0.5, 1.4, 24);
    if (type === 'sphere') return new THREE.SphereGeometry(0.6, 24, 16);
    if (type === 'cone') return new THREE.ConeGeometry(0.6, 1.3, 20);
    return new THREE.BoxGeometry(1, 1, 1);
  }

  function addPart(type) {
    var geometry = makeGeometry(type);
    var material = new THREE.MeshStandardMaterial({
      color: 0x2fb8d4,
      emissive: 0x0a4a55,
      metalness: 0.4,
      roughness: 0.35,
      wireframe: false
    });
    var mesh = new THREE.Mesh(geometry, material);
    mesh.position.set(0, 0, 0);
    scene.add(mesh);

    var edgeGeo = new THREE.EdgesGeometry(geometry);
    var edgeMat = new THREE.LineBasicMaterial({ color: 0x8ff4ff });
    var edges = new THREE.LineSegments(edgeGeo, edgeMat);
    mesh.add(edges);

    parts.push({ mesh: mesh, type: type });
    updatePartCount();
    selectPart(mesh);
  }

  function selectPart(mesh) {
    parts.forEach(function(p) {
      p.mesh.material.emissive.setHex(0x0a4a55);
    });

    selected = mesh;
    mesh.material.emissive.setHex(0x1fb0c8);

    document.getElementById('selInfo').innerText =
      'SELECTED: ' + partTypeOf(mesh).toUpperCase();

    document.getElementById('panel').classList.add('visible');
    document.getElementById('posX').value = mesh.position.x;
    document.getElementById('posY').value = mesh.position.y;
    document.getElementById('posZ').value = mesh.position.z;
    document.getElementById('scaleAll').value = mesh.scale.x;
    document.getElementById('rotY').value = (mesh.rotation.y * 180 / Math.PI);
  }

  function partTypeOf(mesh) {
    var found = parts.find(function(p) { return p.mesh === mesh; });
    return found ? found.type : 'part';
  }

  function updatePartCount() {
    document.getElementById('partCount').innerText = 'PARTS: ' + parts.length;
  }

  ['posX', 'posY', 'posZ', 'scaleAll', 'rotY'].forEach(function(id) {
    document.getElementById(id).addEventListener('input', function() {
      if (!selected) return;
      selected.position.x = parseFloat(document.getElementById('posX').value);
      selected.position.y = parseFloat(document.getElementById('posY').value);
      selected.position.z = parseFloat(document.getElementById('posZ').value);
      var s = parseFloat(document.getElementById('scaleAll').value);
      selected.scale.set(s, s, s);
      selected.rotation.y = parseFloat(document.getElementById('rotY').value) * Math.PI / 180;
    });
  });

  document.getElementById('deleteBtn').addEventListener('click', function() {
    if (!selected) return;
    scene.remove(selected);
    parts = parts.filter(function(p) { return p.mesh !== selected; });
    selected = null;
    document.getElementById('panel').classList.remove('visible');
    document.getElementById('selInfo').innerText = 'NO SELECTION';
    updatePartCount();
  });

  function resetScene() {
    parts.forEach(function(p) { scene.remove(p.mesh); });
    parts = [];
    selected = null;
    document.getElementById('panel').classList.remove('visible');
    document.getElementById('selInfo').innerText = 'NO SELECTION';
    updatePartCount();
  }

  function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
  }

  window.addEventListener('resize', function() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  init();
</script>
</body>
</html>
