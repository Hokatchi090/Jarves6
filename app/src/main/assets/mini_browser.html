<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: transparent; overflow: hidden;
  }

  #panel {
    position: absolute;
    top: 4px; left: 4px; right: 4px; bottom: 4px;
    border: 1px solid rgba(65, 224, 244, 0.4);
    background: #05080a;
    overflow: hidden;
  }

  .corner {
    position: absolute;
    width: 14px; height: 14px;
    border-color: #41e0f4;
    border-style: solid;
    z-index: 600;
    pointer-events: none;
  }
  #cTL { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
  #cTR { top: -1px; right: -1px; border-width: 2px 2px 0 0; }
  #cBL { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; }
  #cBR { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

  #siteFrame {
    position: absolute;
    top: 18px; left: 0; right: 0; bottom: 14px;
    width: 100%;
    border: none;
    background: #0a1014;
  }

  #statusLabel {
    position: absolute;
    top: 4px; left: 8px;
    font-family: monospace;
    font-size: 9px;
    letter-spacing: 1px;
    color: #7fe9f0;
    z-index: 600;
    pointer-events: none;
    text-shadow: 0 0 4px rgba(0,0,0,0.8);
    max-width: 60%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #titleLabel {
    position: absolute;
    top: 4px; right: 8px;
    font-family: monospace;
    font-size: 9px;
    letter-spacing: 1px;
    color: #4a808a;
    z-index: 600;
    pointer-events: none;
  }

  #hintLabel {
    position: absolute;
    bottom: 2px; left: 0; right: 0;
    text-align: center;
    font-family: monospace;
    font-size: 8px;
    color: #4a808a;
    z-index: 600;
    pointer-events: none;
  }

  #tapCatcher {
    position: absolute;
    top: 0; left: 0; right: 0; height: 18px;
    z-index: 700;
  }
</style>
</head>
<body>

<div id="panel">
  <div id="statusLabel">READY</div>
  <div id="titleLabel">WEB</div>
  <iframe id="siteFrame" src="about:blank"></iframe>
  <div id="hintLabel">2x TAP TOP BAR: ENLARGE | 3x TAP: FULLSCREEN</div>
  <div id="tapCatcher"></div>
  <div class="corner" id="cTL"></div>
  <div class="corner" id="cTR"></div>
  <div class="corner" id="cBL"></div>
  <div class="corner" id="cBR"></div>
</div>

<script>
// \u064A\u0646\u0627\u062F\u064A\u0647 Kotlin \u0644\u062A\u062D\u0645\u064A\u0644 \u0645\u0648\u0642\u0639 \u062C\u062F\u064A\u062F \u062C\u0648\u0627 \u0627\u0644\u0644\u0648\u062D\u0629
function loadSite(url) {
  document.getElementById('siteFrame').src = url;
  document.getElementById('statusLabel').textContent = url;
}

// ---------------- \u0625\u064A\u0645\u0627\u0621\u0627\u062A \u0627\u0644\u0644\u0645\u0633 \u0639\u0644\u0649 \u0627\u0644\u0634\u0631\u064A\u0637 \u0627\u0644\u0639\u0644\u0648\u064A \u0641\u0642\u0637 (\u0628\u0627\u0642\u064A \u0627\u0644\u0644\u0648\u062D\u0629 \u062A\u0628\u0642\u0649 \u062A\u062A\u0641\u0627\u0639\u0644 \u0645\u0639 \u0627\u0644\u0645\u0648\u0642\u0639 \u0639\u0627\u062F\u064A) ----------------
var tapCount = 0;
var tapTimer = null;

document.getElementById('tapCatcher').addEventListener('click', function () {
  tapCount++;
  if (tapTimer) clearTimeout(tapTimer);
  tapTimer = setTimeout(function () {
    if (tapCount === 2 && window.BrowserBridge && window.BrowserBridge.onDoubleTap) {
      window.BrowserBridge.onDoubleTap();
    } else if (tapCount >= 3 && window.BrowserBridge && window.BrowserBridge.onTripleTap) {
      window.BrowserBridge.onTripleTap();
    }
    tapCount = 0;
  }, 380);
});
</script>
</body>
</html>
