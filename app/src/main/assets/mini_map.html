<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: transparent; overflow: hidden;
  }

  #panel {
    position: absolute;
    top: 4px; left: 4px; right: 4px; bottom: 4px;
    border: 1px solid rgba(65, 224, 244, 0.4);
    background: #05080a;
    overflow: hidden;
  }

  .corner {
    position: absolute;
    width: 14px; height: 14px;
    border-color: #41e0f4;
    border-style: solid;
    z-index: 600;
    pointer-events: none;
  }
  #cTL { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
  #cTR { top: -1px; right: -1px; border-width: 2px 2px 0 0; }
  #cBL { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; }
  #cBR { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

  #map3d {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    display: none;
  }

  #cyanTint {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(30, 140, 160, 0.16);
    pointer-events: none;
    z-index: 400;
    display: none;
  }

  #fallbackCanvas {
    width: 100%; height: 100%;
    display: block;
  }

  #locDot {
    width: 14px; height: 14px;
    background: #8ff2fa;
    border: 2px solid #ffffff;
    border-radius: 50%;
    box-shadow: 0 0 10px 4px rgba(143, 242, 250, 0.85);
  }

  #statusLabel {
    position: absolute;
    top: 4px; left: 8px;
    font-family: monospace;
    font-size: 9px;
    letter-spacing: 1px;
    color: #7fe9f0;
    z-index: 600;
    pointer-events: none;
    text-shadow: 0 0 4px rgba(0,0,0,0.8);
  }

  #titleLabel {
    position: absolute;
    top: 4px; right: 8px;
    font-family: monospace;
    font-size: 9px;
    letter-spacing: 1px;
    color: #4a808a;
    z-index: 600;
    pointer-events: none;
  }

  #hintLabel {
    position: absolute;
    bottom: 4px; left: 0; right: 0;
    text-align: center;
    font-family: monospace;
    font-size: 8px;
    color: #4a808a;
    z-index: 600;
    pointer-events: none;
  }

  #tapCatcher {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 700;
  }
</style>
</head>
<body>

<div id="panel">
  <div id="map3d"></div>
  <canvas id="fallbackCanvas"></canvas>
  <div id="cyanTint"></div>
  <div id="statusLabel">NO SIGNAL</div>
  <div id="titleLabel">MAP 3D</div>
  <div id="hintLabel">2x TAP: ENLARGE | 3x TAP: FULLSCREEN</div>
  <div id="tapCatcher"></div>
  <div class="corner" id="cTL"></div>
  <div class="corner" id="cTR"></div>
  <div class="corner" id="cBL"></div>
  <div class="corner" id="cBR"></div>
</div>

<script>
var mode = null;
var map3d = null;
var lastLat = null;
var lastLon = null;
var rotationTimer = null;
var currentBearing = 0;

// ---------------- \u062E\u0631\u064A\u0637\u0629 3D \u062D\u0642\u064A\u0642\u064A\u0629: MapLibre GL + OpenFreeMap (\u0645\u062C\u0627\u0646\u064A\u0629 \u0628\u0627\u0644\u0643\u0627\u0645\u0644\u060C \u0628\u0644\u0627 \u0645\u0641\u062A\u0627\u062D) ----------------
function initMap3D(lat, lon) {
  if (map3d) return;
  document.getElementById('map3d').style.display = 'block';
  document.getElementById('cyanTint').style.display = 'block';

  map3d = new maplibregl.Map({
    container: 'map3d',
    style: 'https://tiles.openfreemap.org/styles/dark',
    center: [lon, lat],
    zoom: 16.5,
    pitch: 62,
    bearing: 0,
    attributionControl: false,
    interactive: true
  });

  map3d.on('load', function () {
    // \u0646\u0636\u064A\u0641 \u0637\u0628\u0642\u0629 \u0645\u0628\u0627\u0646\u064A \u062D\u0642\u064A\u0642\u064A\u0629 \u062B\u0644\u0627\u062B\u064A\u0629 \u0627\u0644\u0623\u0628\u0639\u0627\u062F (\u0627\u0631\u062A\u0641\u0627\u0639 \u062D\u0642\u064A\u0642\u064A \u062D\u0633\u0628 \u0627\u0631\u062A\u0641\u0627\u0639 \u0627\u0644\u0645\u0628\u0646\u0649 \u0627\u0644\u0641\u0639\u0644\u064A)
    try {
      var layers = map3d.getStyle().layers;
      var labelLayerId = null;
      for (var i = 0; i < layers.length; i++) {
        if (layers[i].type === 'symbol' && layers[i].layout && layers[i].layout['text-field']) {
          labelLayerId = layers[i].id;
          break;
        }
      }
      map3d.addLayer({
        id: '3d-buildings',
        source: 'openmaptiles',
        'source-layer': 'building',
        type: 'fill-extrusion',
        minzoom: 14,
        paint: {
          'fill-extrusion-color': [
            'interpolate', ['linear'], ['coalesce', ['get', 'render_height'], 8],
            0, '#173b45',
            50, '#2f8fa3',
            150, '#41e0f4'
          ],
          'fill-extrusion-height': [
            'interpolate', ['linear'], ['zoom'],
            14, 0,
            16, ['coalesce', ['get', 'render_height'], 8]
          ],
          'fill-extrusion-base': ['coalesce', ['get', 'render_min_height'], 0],
          'fill-extrusion-opacity': 0.85
        }
      }, labelLayerId || undefined);
    } catch (e) {
      // \u0625\u0630\u0627 \u0627\u0644\u0637\u0628\u0642\u0629 \u0645\u0627\u062A\u0648\u0641\u0631\u062A\u0634 \u0641\u064A \u0647\u0630\u0627 \u0627\u0644\u0645\u0635\u062F\u0631\u060C \u0627\u0644\u062E\u0631\u064A\u0637\u0629 \u062A\u0628\u0642\u0649 \u062A\u0634\u062A\u063A\u0644 \u0639\u0627\u062F\u064A \u0628\u0644\u0627 \u0645\u0628\u0627\u0646\u064A 3D
    }

    new maplibregl.Marker({ element: makeLocDot() })
      .setLngLat([lon, lat])
      .addTo(map3d);

    // \u062F\u0648\u0631\u0627\u0646 \u0628\u0637\u064A\u0621 \u0648\u0645\u0633\u062A\u0645\u0631 \u0644\u0644\u0643\u0627\u0645\u064A\u0631\u0627 \u062D\u0648\u0644 \u0627\u0644\u0645\u0648\u0642\u0639 (\u0645\u062F\u0627\u0631 3D \u062D\u0642\u064A\u0642\u064A\u060C \u0645\u0627 \u0634\u064A\u0621 CSS)
      startBearingRotation();
    document.getElementById('statusLabel').textContent = 'LOCKED 3D';
    notifyStatusOnce('online');
  });

  map3d.on('error', function () {
    if (mode !== 'fallback') activateFallback();
  });
}

function makeLocDot() {
  var el = document.createElement('div');
  el.id = 'locDot';
  return el;
}

function startBearingRotation() {
  if (rotationTimer) return;
  rotationTimer = setInterval(function () {
    if (!map3d) return;
    currentBearing = (currentBearing + 0.4) % 360;
    map3d.setBearing(currentBearing);
  }, 60);
}

function drawFallback(lat, lon) {
  var canvas = document.getElementById('fallbackCanvas');
  var w = canvas.clientWidth;
  var h = canvas.clientHeight;
  canvas.width = w;
  canvas.height = h;
  var ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, w, h);

  var cx = w / 2;
  var cy = h / 2;

  ctx.strokeStyle = 'rgba(65, 224, 244, 0.5)';
  ctx.lineWidth = 1;
  for (var i = 1; i <= 6; i++) {
    var pos = (w / 7) * i;
    ctx.beginPath();
    ctx.moveTo(pos, 0);
    ctx.lineTo(pos, h);
    ctx.stroke();
  }
  for (var j = 1; j <= 4; j++) {
    var posY = (h / 5) * j;
    ctx.beginPath();
    ctx.moveTo(0, posY);
    ctx.lineTo(w, posY);
    ctx.stroke();
  }

  ctx.strokeStyle = 'rgba(65, 224, 244, 0.35)';
  for (var r = 1; r <= 3; r++) {
    ctx.beginPath();
    ctx.arc(cx, cy, (Math.min(w, h) / 2) * (r / 3), 0, Math.PI * 2);
    ctx.stroke();
  }

  ctx.fillStyle = '#8ff2fa';
  ctx.beginPath();
  ctx.arc(cx, cy, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowColor = '#8ff2fa';
  ctx.shadowBlur = 10;
  ctx.fill();
}

function notifyStatusOnce(status) {
  if (window.MapBridge && window.MapBridge.onStatusChange && !window.__statusNotified) {
    window.__statusNotified = true;
    window.MapBridge.onStatusChange(status);
  }
}

function activateFallback() {
  if (mode === 'fallback') return;
  mode = 'fallback';
  document.getElementById('fallbackCanvas').style.display = 'block';
  if (lastLat !== null) {
    drawFallback(lastLat, lastLon);
    document.getElementById('statusLabel').textContent = 'LOCKED (OFFLINE)';
    notifyStatusOnce('offline');
  }
}

function setCoords(lat, lon) {
  lastLat = lat;
  lastLon = lon;

  if (mode === '3d') {
    try {
      if (!map3d) {
        initMap3D(lat, lon);
      } else {
        map3d.setCenter([lon, lat]);
      }
      return;
    } catch (e) {
      mode = null;
    }
  }

  if (mode !== 'fallback') {
    activateFallback();
  } else {
    drawFallback(lat, lon);
  }
}

var mlScript = document.createElement('script');
mlScript.src = 'https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js';
mlScript.onload = function () {
  if (mode === null) {
    mode = '3d';
    if (lastLat !== null) setCoords(lastLat, lastLon);
  }
};
mlScript.onerror = function () {
  if (mode === null) activateFallback();
};
document.head.appendChild(mlScript);

setTimeout(function () {
  if (mode === null) activateFallback();
}, 4000);

// ---------------- \u0625\u064A\u0645\u0627\u0621\u0627\u062A \u0627\u0644\u0644\u0645\u0633: \u0636\u063A\u0637\u062A\u064A\u0646 = \u062A\u0643\u0628\u064A\u0631\u060C 3 \u0636\u063A\u0637\u0627\u062A = \u0634\u0627\u0634\u0629 \u0643\u0627\u0645\u0644\u0629 ----------------
var tapCount = 0;
var tapTimer = null;

document.getElementById('tapCatcher').addEventListener('click', function () {
  tapCount++;
  if (tapTimer) clearTimeout(tapTimer);
  tapTimer = setTimeout(function () {
    if (tapCount === 2 && window.MapBridge && window.MapBridge.onDoubleTap) {
      window.MapBridge.onDoubleTap();
    } else if (tapCount >= 3 && window.MapBridge && window.MapBridge.onTripleTap) {
      window.MapBridge.onTripleTap();
    }
    tapCount = 0;
  }, 380);
});
</script>
</body>
</html>
