<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: transparent; overflow: hidden;
  }

  #ring {
    position: absolute;
    top: 50%; left: 50%;
    width: 92%; height: 92%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    overflow: hidden;
    border: 2px solid rgba(65, 224, 244, 0.55);
    background: #05080a;
    animation: spin 90s linear infinite;
  }

  @keyframes spin {
    from { transform: translate(-50%, -50%) rotate(0deg); }
    to   { transform: translate(-50%, -50%) rotate(360deg); }
  }

  #map {
    width: 100%; height: 100%;
    filter: invert(1) hue-rotate(155deg) saturate(2.4) brightness(0.85) contrast(1.15);
    display: none;
  }

  #fallbackCanvas {
    width: 100%; height: 100%;
    display: block;
  }

  #centerDot {
    position: absolute;
    top: 50%; left: 50%;
    width: 8px; height: 8px;
    margin: -4px 0 0 -4px;
    background: #8ff2fa;
    border-radius: 50%;
    box-shadow: 0 0 8px 3px rgba(143, 242, 250, 0.85);
    z-index: 500;
    pointer-events: none;
    display: none;
  }

  #statusLabel {
    position: absolute;
    bottom: 2px; left: 0; right: 0;
    text-align: center;
    font-family: monospace;
    font-size: 9px;
    color: #7fe9f0;
    z-index: 500;
    pointer-events: none;
    text-shadow: 0 0 4px rgba(0,0,0,0.8);
  }
</style>
</head>
<body>

<div id="ring">
  <div id="map"></div>
  <canvas id="fallbackCanvas"></canvas>
</div>
<div id="centerDot"></div>
<div id="statusLabel">NO SIGNAL</div>

<script>
var mode = null;
var map = null;
var marker = null;
var lastLat = null;
var lastLon = null;

function initLeafletMap(lat, lon) {
  if (map) return;
  document.getElementById('map').style.display = 'block';
  map = L.map('map', {
    zoomControl: false,
    attributionControl: false,
    dragging: true,
    scrollWheelZoom: false,
    doubleClickZoom: false
  }).setView([lat, lon], 15);

  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19
  }).addTo(map);

  marker = L.circleMarker([lat, lon], {
    radius: 6,
    color: '#41e0f4',
    fillColor: '#41e0f4',
    fillOpacity: 0.9
  }).addTo(map);
}

function drawFallback(lat, lon) {
  var canvas = document.getElementById('fallbackCanvas');
  var w = canvas.clientWidth;
  var h = canvas.clientHeight;
  canvas.width = w;
  canvas.height = h;
  var ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, w, h);

  var cx = w / 2;
  var cy = h / 2;
  var color = 'rgba(65, 224, 244, 0.5)';

  ctx.strokeStyle = color;
  ctx.lineWidth = 1;
  for (var i = 1; i <= 4; i++) {
    var pos = (w / 5) * i;
    ctx.beginPath();
    ctx.moveTo(pos, 0);
    ctx.lineTo(pos, h);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, pos);
    ctx.lineTo(w, pos);
    ctx.stroke();
  }

  ctx.strokeStyle = 'rgba(65, 224, 244, 0.35)';
  ctx.lineWidth = 1;
  for (var r = 1; r <= 3; r++) {
    ctx.beginPath();
    ctx.arc(cx, cy, (Math.min(w, h) / 2) * (r / 3), 0, Math.PI * 2);
    ctx.stroke();
  }

  ctx.fillStyle = '#8ff2fa';
  ctx.beginPath();
  ctx.arc(cx, cy, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowColor = '#8ff2fa';
  ctx.shadowBlur = 10;
  ctx.fill();
}

function activateFallback() {
  if (mode === 'fallback') return;
  mode = 'fallback';
  document.getElementById('fallbackCanvas').style.display = 'block';
  if (lastLat !== null) {
    drawFallback(lastLat, lastLon);
    document.getElementById('statusLabel').textContent = 'LOCKED (OFFLINE)';
  }
}

function setCoords(lat, lon) {
  lastLat = lat;
  lastLon = lon;

  if (mode === 'leaflet') {
    try {
      if (!map) {
        initLeafletMap(lat, lon);
      } else {
        map.setView([lat, lon]);
        if (marker) marker.setLatLng([lat, lon]);
      }
      document.getElementById('statusLabel').textContent = 'LOCKED';
      return;
    } catch (e) {
      mode = null;
    }
  }

  if (mode !== 'fallback') {
    activateFallback();
  } else {
    drawFallback(lat, lon);
    document.getElementById('statusLabel').textContent = 'LOCKED (OFFLINE)';
  }
}

var leafletScript = document.createElement('script');
leafletScript.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
leafletScript.onload = function () {
  if (mode === null) {
    mode = 'leaflet';
    if (lastLat !== null) {
      setCoords(lastLat, lastLon);
    }
  }
};
leafletScript.onerror = function () {
  if (mode === null) {
    activateFallback();
  }
};
document.head.appendChild(leafletScript);

setTimeout(function () {
  if (mode === null) {
    activateFallback();
  }
}, 3000);
</script>
</body>
</html>
