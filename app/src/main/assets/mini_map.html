<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: transparent; overflow: hidden;
  }

  /* \u0627\u0644\u0625\u0637\u0627\u0631 \u0627\u0644\u0645\u0633\u062A\u0637\u064A\u0644: \u0644\u0648\u062D\u0629 \u0632\u062C\u0627\u062C\u064A\u0629 \u0628\u0632\u0648\u0627\u064A\u0627 HUD \u0628\u062F\u0644 \u062F\u0627\u0626\u0631\u0629 \u062A\u062F\u0648\u0631 */
  #panel {
    position: absolute;
    top: 4px; left: 4px; right: 4px; bottom: 4px;
    border: 1px solid rgba(65, 224, 244, 0.4);
    background: #05080a;
    overflow: hidden;
  }

  .corner {
    position: absolute;
    width: 14px; height: 14px;
    border-color: #41e0f4;
    border-style: solid;
    z-index: 600;
    pointer-events: none;
  }
  #cTL { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
  #cTR { top: -1px; right: -1px; border-width: 2px 2px 0 0; }
  #cBL { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; }
  #cBR { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

  /* \u0645\u0646\u0637\u0642\u0629 \u0627\u0644\u0645\u0634\u0647\u062F: \u062A\u0637\u0628\u064A\u0642 \u0645\u0646\u0638\u0648\u0631 3D \u0628\u0625\u0645\u0627\u0644\u0629 \u0628\u0633\u064A\u0637\u0629 \u062A\u0639\u0637\u064A \u0625\u062D\u0633\u0627\u0633 \u0627\u0644\u0639\u0645\u0642 \u0628\u062F\u0644 \u062E\u0631\u064A\u0637\u0629 \u0645\u0633\u0637\u062D\u0629 */
  #viewport {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    perspective: 500px;
    perspective-origin: 50% 20%;
  }

  #mapTilt {
    position: absolute;
    top: -15%; left: -15%; width: 130%; height: 145%;
    transform: rotateX(35deg) scale(1.15);
    transform-origin: 50% 30%;
  }

  #map {
    width: 100%; height: 100%;
    display: none;
  }

  #cyanTint {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(30, 140, 160, 0.22);
    pointer-events: none;
    z-index: 400;
    display: none;
  }

  #fallbackCanvas {
    width: 100%; height: 100%;
    display: block;
  }

  #centerDot {
    position: absolute;
    top: 20%; left: 50%;
    width: 8px; height: 8px;
    margin: -4px 0 0 -4px;
    background: #8ff2fa;
    border-radius: 50%;
    box-shadow: 0 0 8px 3px rgba(143, 242, 250, 0.85);
    z-index: 500;
    pointer-events: none;
    display: none;
  }

  #statusLabel {
    position: absolute;
    top: 4px; left: 8px;
    font-family: monospace;
    font-size: 9px;
    letter-spacing: 1px;
    color: #7fe9f0;
    z-index: 600;
    pointer-events: none;
    text-shadow: 0 0 4px rgba(0,0,0,0.8);
  }

  #titleLabel {
    position: absolute;
    top: 4px; right: 8px;
    font-family: monospace;
    font-size: 9px;
    letter-spacing: 1px;
    color: #4a808a;
    z-index: 600;
    pointer-events: none;
  }

  #hintLabel {
    position: absolute;
    bottom: 4px; left: 0; right: 0;
    text-align: center;
    font-family: monospace;
    font-size: 8px;
    color: #4a808a;
    z-index: 600;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="panel">
  <div id="viewport">
    <div id="mapTilt">
      <div id="map"></div>
      <canvas id="fallbackCanvas"></canvas>
    </div>
  </div>
  <div id="cyanTint"></div>
  <div id="centerDot"></div>
  <div id="statusLabel">NO SIGNAL</div>
  <div id="titleLabel">MAP</div>
  <div id="hintLabel">2x TAP: ENLARGE  |  3x TAP: FULLSCREEN</div>
  <div class="corner" id="cTL"></div>
  <div class="corner" id="cTR"></div>
  <div class="corner" id="cBL"></div>
  <div class="corner" id="cBR"></div>
</div>

<script>
var mode = null;
var map = null;
var marker = null;
var lastLat = null;
var lastLon = null;

function initLeafletMap(lat, lon) {
  if (map) return;
  document.getElementById('map').style.display = 'block';
  document.getElementById('cyanTint').style.display = 'block';
  map = L.map('map', {
    zoomControl: false,
    attributionControl: false,
    dragging: true,
    scrollWheelZoom: false,
    doubleClickZoom: false
  }).setView([lat, lon], 15);

  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png', {
    maxZoom: 19,
    subdomains: 'abcd'
  }).addTo(map);

  marker = L.circleMarker([lat, lon], {
    radius: 6,
    color: '#41e0f4',
    fillColor: '#41e0f4',
    fillOpacity: 0.9
  }).addTo(map);
}

function drawFallback(lat, lon) {
  var canvas = document.getElementById('fallbackCanvas');
  var w = canvas.clientWidth;
  var h = canvas.clientHeight;
  canvas.width = w;
  canvas.height = h;
  var ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, w, h);

  var cx = w / 2;
  var cy = h / 2;

  ctx.strokeStyle = 'rgba(65, 224, 244, 0.5)';
  ctx.lineWidth = 1;
  for (var i = 1; i <= 6; i++) {
    var pos = (w / 7) * i;
    ctx.beginPath();
    ctx.moveTo(pos, 0);
    ctx.lineTo(pos, h);
    ctx.stroke();
  }
  for (var j = 1; j <= 4; j++) {
    var posY = (h / 5) * j;
    ctx.beginPath();
    ctx.moveTo(0, posY);
    ctx.lineTo(w, posY);
    ctx.stroke();
  }

  ctx.strokeStyle = 'rgba(65, 224, 244, 0.35)';
  for (var r = 1; r <= 3; r++) {
    ctx.beginPath();
    ctx.arc(cx, cy, (Math.min(w, h) / 2) * (r / 3), 0, Math.PI * 2);
    ctx.stroke();
  }

  ctx.fillStyle = '#8ff2fa';
  ctx.beginPath();
  ctx.arc(cx, cy, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowColor = '#8ff2fa';
  ctx.shadowBlur = 10;
  ctx.fill();
}

function notifyStatusOnce(status) {
  if (window.MapBridge && window.MapBridge.onStatusChange && !window.__statusNotified) {
    window.__statusNotified = true;
    window.MapBridge.onStatusChange(status);
  }
}

function activateFallback() {
  if (mode === 'fallback') return;
  mode = 'fallback';
  document.getElementById('fallbackCanvas').style.display = 'block';
  if (lastLat !== null) {
    drawFallback(lastLat, lastLon);
    document.getElementById('statusLabel').textContent = 'LOCKED (OFFLINE)';
    notifyStatusOnce('offline');
  }
}

function setCoords(lat, lon) {
  lastLat = lat;
  lastLon = lon;

  if (mode === 'leaflet') {
    try {
      if (!map) {
        initLeafletMap(lat, lon);
      } else {
        map.setView([lat, lon]);
        if (marker) marker.setLatLng([lat, lon]);
      }
      document.getElementById('statusLabel').textContent = 'LOCKED';
      notifyStatusOnce('online');
      return;
    } catch (e) {
      mode = null;
    }
  }

  if (mode !== 'fallback') {
    activateFallback();
  } else {
    drawFallback(lat, lon);
    document.getElementById('statusLabel').textContent = 'LOCKED (OFFLINE)';
    notifyStatusOnce('offline');
  }
}

// \u0625\u0639\u0627\u062F\u0629 \u0631\u0633\u0645 \u0627\u0644\u0628\u062F\u064A\u0644 \u0644\u0645\u0627 \u064A\u062A\u063A\u064A\u0631 \u062D\u062C\u0645 \u0627\u0644\u0644\u0648\u062D\u0629 (\u0645\u062B\u0644\u0627\u064B \u0628\u0639\u062F \u0627\u0644\u062A\u0643\u0628\u064A\u0631)
window.addEventListener('resize', function () {
  if (mode === 'fallback' && lastLat !== null) {
    drawFallback(lastLat, lastLon);
  }
  if (map) {
    setTimeout(function () { map.invalidateSize(); }, 200);
  }
});

var leafletScript = document.createElement('script');
leafletScript.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
leafletScript.onload = function () {
  if (mode === null) {
    mode = 'leaflet';
    if (lastLat !== null) setCoords(lastLat, lastLon);
  }
};
leafletScript.onerror = function () {
  if (mode === null) activateFallback();
};
document.head.appendChild(leafletScript);

setTimeout(function () {
  if (mode === null) activateFallback();
}, 3000);

// ---------------- \u0625\u064A\u0645\u0627\u0621\u0627\u062A \u0627\u0644\u0644\u0645\u0633: \u0636\u063A\u0637\u062A\u064A\u0646 = \u062A\u0643\u0628\u064A\u0631\u060C 3 \u0636\u063A\u0637\u0627\u062A = \u0634\u0627\u0634\u0629 \u0643\u0627\u0645\u0644\u0629 ----------------
var tapCount = 0;
var tapTimer = null;

document.getElementById('panel').addEventListener('click', function () {
  tapCount++;
  if (tapTimer) clearTimeout(tapTimer);
  tapTimer = setTimeout(function () {
    if (tapCount === 2 && window.MapBridge && window.MapBridge.onDoubleTap) {
      window.MapBridge.onDoubleTap();
    } else if (tapCount >= 3 && window.MapBridge && window.MapBridge.onTripleTap) {
      window.MapBridge.onTripleTap();
    }
    tapCount = 0;
  }, 380);
});
</script>
</body>
</html>
