# ============================================================
# \u0632\u064A\u062F \u0647\u0630\u0627 \u0627\u0644\u062C\u0632\u0621 \u0642\u0628\u0644 \u062E\u0637\u0648\u0629 "Build with Gradle" (./gradlew assembleDebug) \u0641\u064A
# .github/workflows/build.yml \u0627\u0644\u0645\u0648\u062C\u0648\u062F \u0639\u0646\u062F\u0643
#
# \u0642\u0628\u0644 \u0647\u0630\u0627\u060C \u0644\u0627\u0632\u0645 \u062A\u0632\u064A\u062F \u0627\u0644\u0645\u0641\u0627\u062A\u064A\u062D \u0641\u064A GitHub Secrets:
# Settings -> Secrets and variables -> Actions -> New repository secret
#   GEMINI_API_KEY
#   GOOGLE_MAPS_API_KEY
# ============================================================

      - name: Create local.properties with secrets
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> local.properties
          echo "GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}" >> local.properties
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> local.properties
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> local.properties

      - name: Build with Gradle
        run: ./gradlew clean assembleDebug
